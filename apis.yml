aid: finix
name: Finix
description: >-
  Finix is a full-stack payments technology provider that lets software platforms,
  marketplaces, and merchants accept and send payments online and in person. The
  Finix API is a HAL/HATEOAS REST API (HTTP Basic authentication per RFC 7617,
  date-based Finix-Version header, cursor pagination, idempotency_id) covering
  Identities, Merchants, Payment Instruments, Authorizations, Transfers, Settlements,
  Disputes, Fee Profiles, Verifications, Onboarding Forms, Devices, Balance Transfers,
  Split Transfers, and Webhooks, plus low-code Checkout, Payment Links, Subscriptions,
  and Payouts. It is Level 1 PCI DSS certified with finix.js browser tokenization,
  native iOS/Android SDKs, and official Python, Node.js, Java, and PHP client
  libraries. This profile was enriched from Finix's own public developer surface.
